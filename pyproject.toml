[build-system]
requires = ["briefcase"]

[tool.briefcase]
project_name = "corn-thief-maze"
bundle = "com.cornthief"
version = "1.0.0"
url = "https://example.com/cornthief"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
author = "Your Name"
