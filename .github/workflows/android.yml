name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 17 (required by the Android build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Briefcase
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase

      - name: Create the Android project
        run: briefcase create android --no-input -v

      - name: Build the debug APK
        run: briefcase build android --no-input -v

      - name: Find the APK
        id: find-apk
        run: |
          APK=$(find build -name "*.apk" -path "*outputs/apk*" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found" >&2
            find build -name "*.apk" >&2 || true
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "Found $APK"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: corn-thief-maze-debug-apk
          path: ${{ steps.find-apk.outputs.apk }}
          if-no-files-found: error
