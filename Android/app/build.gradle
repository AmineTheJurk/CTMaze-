plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aminethejurk.cornthiefmaze'
    compileSdk 34

    defaultConfig {
        applicationId 'com.aminethejurk.cornthiefmaze'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled false
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib:1.8.22') {
            because 'Align Kotlin stdlib with the Android Gradle plugin and avoid duplicate classes.'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'Align Kotlin jdk7 stdlib with the Android Gradle plugin and avoid duplicate classes.'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'Align Kotlin jdk8 stdlib with the Android Gradle plugin and avoid duplicate classes.'
        }
    }

    implementation(platform('org.jetbrains.kotlin:kotlin-bom:1.9.24'))
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
